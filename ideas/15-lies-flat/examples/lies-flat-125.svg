<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
<title>Lies Flat 125</title>
<desc>Lies Flat, seed 125. A3 landscape, 420 x 297 mm. Two pens, both 0.3 mm: black (#000000) for the sheet&apos;s outline and its mountain folds, red (#c8102e) for its valley folds. Left: the crease pattern; each of its 289 interior vertices passes Kawasaki&apos;s and Maekawa&apos;s conditions. Right: the same creases after the sheet is folded flat, as if the paper were transparent (cut edges left out); where creases of both colours coincide, black is drawn.</desc>
