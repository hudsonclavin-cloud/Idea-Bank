105.000" y="128.000" text-anchor="middle" font-family="monospace" font-size="2.2" fill="#817b66">12 MOMENTS</text><g font-family="monospace" font-size="2.8" fill="#263c3a"><text x="15" y="236">CUT: outer circle + white slots + 4mm centre hole.</text><text x="15" y="242">Use a smooth 3mm shaft; loosely retain with the two card washers.</text><text x="15" y="248">Printed face toward mirror. Look through slits from the back.</text><text x="15" y="254">Spin gently. Reverse the spin to reverse the sequence.</text><path d="M15 271h50M15 269v4M65 269v4" fill="none" stroke="#263c3a" stroke-width=".3"/><text x="15" y="266">CHECK THIS LINE: 50mm</text><g fill="none" stroke="#263c3a" stroke-width=".25"><circle cx="175" cy="270" r="5"/><circle cx="175" cy="270" r="1.5"/><circle cx="190" cy="270" r="5"/><circle cx="190" cy="270" r="1.5"/></g><text x="153" y="262" font-size="2.3">AXLE WASHERS / 3mm HOLES</text><text x="15" y="284">Cardstock 160–220gsm · continuous outer rim · unassembled prototype</text></g></svg>